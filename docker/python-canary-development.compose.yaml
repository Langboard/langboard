# Overlay the existing retained-storage Dokploy backend Compose.
# Development canary only: source is the native Dokploy Git checkout.
# Use --project-directory .; retain the protected backend base and stable project name.
# Product releases consume separately verified immutable images with --no-build.
services:
  vault:
    init: true
    container_name: langboard_vault
    image: openbao/openbao:latest
    environment:
      - BAO_LOCAL_CONFIG={"listener":{"tcp":{"address":"0.0.0.0:8200","tls_disable":true}},"storage":{"file":{"path":"/openbao/file"}},"api_addr":"http://0.0.0.0:8200","disable_mlock":true,"ui":true}
      - ROOT_TOKEN=${KEY_PROVIDER_OPENBAO_ROOT_TOKEN}
      - PROJECT_NAME=${PROJECT_NAME}
    volumes:
      - ./vault/entrypoint.sh:/entrypoint.sh:ro
      - ${VAULT_DATA_MOUNT:-./volumes/vault/file}:/openbao/file
      - ./volumes/vault/logs:/openbao/logs
      - ./volumes/vault/config:/bao/config
      - ./volumes/.vault-credentials:/openbao/.vault-credentials
      - ./volumes/vault-secret.json:/openbao/vault-secret.json
    cap_add:
      - IPC_LOCK
    command: ["sh", "/entrypoint.sh"]
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -s /openbao/.vault-credentials && wget -qO- 'http://127.0.0.1:8200/v1/sys/health?standbyok=true' >/dev/null",
        ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      net:
        aliases:
          - langboard_vault
    restart: always
  api:
    environment:
      INSTANCE_DEFAULT_LANGUAGE: ko-KR
      KEY_PROVIDER_OPENBAO_URL: http://host.docker.internal:8200
      SOCKET_INTERNAL_URL: http://socket:5690
      SOCKET_EDITOR_INTERNAL_URL: http://socket:5690
    extra_hosts:
      - host.docker.internal:host-gateway
    image: langboard-api-development:canary
    build:
      context: .
      dockerfile: docker/api-canary-development.Dockerfile
      target: development
  worker:
    environment:
      SOCKET_INTERNAL_URL: http://socket:5690
      SOCKET_EDITOR_INTERNAL_URL: http://socket:5690
    image: langboard-worker-development:canary
    build:
      context: .
      dockerfile: docker/api-canary-development.Dockerfile
      target: development
      args:
        API_RUNTIME_BASE: ghcr.io/yamonco/fractalops-project-7bdcad0a841cbf9cb68f7b3976cb96aa2c8acf5443df4d67b6c624af8edf504b-worker@sha256:257c62df6d106208d524925749b650fee8d2a79796173c644d1ce2da86ca3d51
        INSTALL_DOCUMENT_PROCESSING: "1"
  graph:
    environment:
      SOCKET_INTERNAL_URL: http://socket:5690
      SOCKET_EDITOR_INTERNAL_URL: http://socket:5690
    image: langboard-graph-development:canary
    build:
      context: .
      dockerfile: docker/graph-canary-development.Dockerfile
      target: development
  socket:
    image: langboard-socket-development:canary
    build:
      context: ./src
      dockerfile: socket/Dockerfile
      target: runtime

networks:
  net:
    external: true
    name: ${PROJECT_NAME}_network
