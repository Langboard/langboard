# Development only: Dokploy checks out the selected Git branch and builds locally.
# Use --project-directory . and --env-file docker/.env with native Git checkout.
# Build and Watch paths share the repository root; Dokploy writes env beside Compose.
# Product releases use ui-canary-runtime.compose.yaml and verified immutable images.
services:
  web:
    image: langboard-ui-development:canary
    build:
      context: .
      dockerfile: docker/ui-production.Dockerfile
      target: development
      args:
        UI_NODE_IMAGE: public.ecr.aws/docker/library/node:22@sha256:0e5f906573693feaa1e21057ebdcfdb5bd5021f050b2dc7c9deceb629c7da2a8
        UI_BUILD_MINIFY: "false"
        API_URL: https://api-langboard.yamon.io
        PUBLIC_UI_URL: https://langboard.yamon.io
        SOCKET_URL: https://ws-langboard.yamon.io
    user: 1000:1000
    mem_limit: 2g
    cpus: 1.5
    environment:
      UI_CANARY_DEV: "true"
      PROJECT_NAME: Langboard
      PROJECT_SHORT_NAME: LB
      API_URL: https://api-langboard.yamon.io
      PUBLIC_UI_URL: https://langboard.yamon.io
      SOCKET_URL: https://ws-langboard.yamon.io
    develop:
      watch:
        - action: sync
          initial_sync: true
          path: src/ui/src
          target: /work/src/ui/src
        - action: sync+restart
          initial_sync: true
          path: src/ui/vite.config.ts
          target: /work/src/ui/vite.config.ts
        - action: sync+restart
          initial_sync: true
          path: src/ui/vite.panelSdkMetadata.mjs
          target: /work/src/ui/vite.panelSdkMetadata.mjs
    restart: unless-stopped
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    expose:
      - '8080'
    networks:
      legacy:
        aliases:
          - ui
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: '3'
    healthcheck:
      test: [CMD, node, -e, "fetch('http://127.0.0.1:8080/index.html').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 5s
      timeout: 5s
      retries: 12
networks:
  legacy:
    external: true
    name: langboard_network
