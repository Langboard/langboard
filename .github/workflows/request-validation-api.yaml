name: Request API Validation
run-name: "API validation request: ${{ github.sha }}"

on:
  push:
    branches: ["review/canary-*"]
    paths:
      - .github/workflows/**
      - scripts/image_build/**
      - .fractalops/image-build.json
      - Dockerfile
      - docker/ui-production.Dockerfile
      - src/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
    inputs:
      source_pr:
        description: Current PR number for validation-only execution
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: image-build-request-${{ github.ref }}-api
  cancel-in-progress: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/heads/review/canary-') }}

jobs:
  request:
    name: request-validation-api
    if: vars.CI_RUNNER != '' && ((github.event_name == 'push' && startsWith(github.ref, 'refs/heads/review/canary-')) || (github.event_name == 'workflow_dispatch' && startsWith(github.ref, 'refs/heads/review/')))
    permissions:
      contents: read
      id-token: write
      pull-requests: read
    # Transport only; validation runs in the central executor.
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: python:3.12.15-slim-bookworm@sha256:6a0e06f5ba0b373d051aabd3fffb9b873f27f9a2a3a14bcbe37dee6f0e3bbc70
    defaults:
      run:
        shell: bash
    timeout-minutes: 15
    env:
      IMAGE_BUILD_COMMIT: ${{ vars.IMAGE_BUILD_COMMIT }}
      IMAGE_BUILD_PROFILE: api
      SOURCE_REPOSITORY: ${{ github.repository }}
      SOURCE_REVISION: ${{ github.sha }}
      SOURCE_REF: ${{ github.ref }}
      SOURCE_EVENT: ${{ github.event_name }}
      SOURCE_PR: ${{ inputs.source_pr }}
      IMAGE_BUILD_BROKER_URL: ${{ vars.IMAGE_BUILD_BROKER_URL }}
      IMAGE_BUILD_OIDC_AUDIENCE: ${{ vars.IMAGE_BUILD_OIDC_AUDIENCE }}
      REQUEST_ID: ${{ github.repository_id }}-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - name: Verify standard request runtime
        run: |
          python3 - <<'PYTHON'
          import json
          import shutil
          import ssl
          import sys
          import urllib.request

          assert sys.version_info[:2] == (3, 12), "Python 3.12 required"
          assert ssl.create_default_context().get_ca_certs(), "Trusted CA certificates required"
          assert all(shutil.which(tool) for tool in ("tar", "gzip")), "Checkout archive tools required"
          print("Python, trusted CA certificates and checkout archive tools available")
          PYTHON
      - name: Checkout federated request client
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Request validation through federated identity
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 scripts/image_build/request_validation.py
