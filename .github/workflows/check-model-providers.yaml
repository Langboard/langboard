name: Check Model Providers
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-model-providers.yaml
      - pyproject.toml
      - uv.lock
      - src/api/langboard/routes/settings/ModelProviderSettingsApi.py
      - src/api/tests/model_providers/**
      - src/api/tests/comment_compaction/test_stage_residency.py
      - src/api/tests/comment_compaction/test_final_read_validation.py
      - src/api/tests/card_workspace/test_document_cleanup_outbox.py
      - src/shared/py/langboard_shared/domain/services/factory/CardCommentCompactionService.py
      - src/shared/py/langboard_shared/domain/services/factory/CardService.py
      - src/shared/py/langboard_shared/domain/services/factory/WorkflowRuleService.py
      - src/shared/py/langboard_shared/infrastructure/repositories/factory/CardCommentCompactionRepository.py
      - src/shared/py/langboard_shared/tasks/docling/**
      - src/api/langboard/routes/board/BoardAvatarApi.py
      - src/shared/py/langboard_shared/ai/avatar_summary.py
      - src/shared/py/langboard_shared/domain/services/factory/AvatarSummaryService.py
      - src/graph/langboard_graph/routes/AvatarSummaryApi.py
      - src/graph/tests/test_avatar_summary_draft.py
      - src/graph/langboard_graph/core/graph/default/chat_model.py
      - src/graph/langboard_graph/core/graph/default/tooling.py
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-contract:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: langboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    defaults:
      run:
        shell: bash
    env:
      PROJECT_NAME: langboard
      PYTHONPATH: src/api:src/shared/py
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # PR checks restore caches; manual runs can warm them without blocking review.
          save-cache: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra image-generation --extra document-retrieval --group avatar-summary-tests
      - name: Model providers and native PostgreSQL compaction indexing
        env:
          PYTHONPATH: src/api:src/shared/py:src/graph
          LANGBOARD_FILE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
        run: uv run --no-sync pytest -q src/api/tests/model_providers src/api/tests/comment_compaction/test_stage_residency.py src/api/tests/comment_compaction/test_final_read_validation.py src/api/tests/card_workspace/test_document_cleanup_outbox.py src/graph/tests/test_avatar_summary_draft.py
