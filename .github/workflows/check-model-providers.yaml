name: Check Model Providers
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-model-providers.yaml
      - src/api/langboard/routes/settings/ModelProviderSettingsApi.py
      - src/api/tests/model_providers/**
      - src/graph/langboard_graph/core/graph/default/chat_model.py
      - src/graph/langboard_graph/core/graph/default/tooling.py
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  catalog-contract:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    env:
      PROJECT_NAME: langboard
      PYTHONPATH: src/api:src/shared/py
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen --extra image-generation
      - run: uv run --no-sync pytest -q src/api/tests/model_providers
