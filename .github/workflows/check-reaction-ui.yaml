name: Check Reaction UI

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-reaction-ui.yaml
      - src/ui/src/components/base/Dock/**
      - src/ui/src/components/ReactionCounter/**
      - src/ui/src/pages/BoardPage/components/card/comment/BoardCommentReaction.tsx
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - name: Prepare Node.js for Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Corepack for Yarn cache
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: src/ui/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: src/ui
      - run: yarn eslint src/components/base/Dock/index.tsx src/components/ReactionCounter/index.tsx src/pages/BoardPage/components/card/comment/BoardCommentReaction.tsx --max-warnings 0
        working-directory: src/ui
