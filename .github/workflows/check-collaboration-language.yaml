name: Check Collaboration Language

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

jobs:
  check:
    if: vars.CI_RUNNER != '' && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    timeout-minutes: 5
    steps:
      # Collaboration text is untrusted data. Never check out or execute PR code.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the trusted language guard
        run: python -m unittest discover -s .github/scripts -p test_collaboration_language.py -v
      - name: Check collaboration event text
        run: python .github/scripts/check_collaboration_language.py
