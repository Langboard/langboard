name: Check GitHub Collaboration Language

on:
  pull_request_target:
    types: [opened, edited, reopened, synchronize]
  issue_comment:
    types: [created, edited]
  pull_request_review:
    types: [submitted, edited]
  pull_request_review_comment:
    types: [created, edited]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: true

jobs:
  check-language:
    if: vars.CI_RUNNER != '' && (github.event_name != 'issue_comment' || github.event.issue.pull_request)
    timeout-minutes: 5
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
      - name: Verify language detection and localization exceptions
        run: python3 -m unittest discover -s .github/scripts -p 'test_*.py'
      - name: Detect Korean prose in PR collaboration text
        run: python3 .github/scripts/check_collaboration_language.py
