name: Check Localization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-localization.yaml
      - src/ui/src/assets/locales/**
      - src/ui/src/i18n.ts
      - src/ui/src/constants.ts
      - src/ui/src/core/utils/LocalePolicy*
      - src/ui/src/core/utils/LocaleRuntime*
      - src/ui/src/core/utils/LocaleFormat*
      - src/ui/src/core/hooks/useUpdateDateDistance.ts
      - src/ui/src/core/stores/McpToolStore.ts
      - src/ui/src/core/stores/BotStatusStore.ts
      - src/ui/src/core/stores/EditorStore.ts
      - src/ui/src/core/stores/UserSettingsStore.ts
      - src/ui/src/core/stores/StoreSnapshot.test.ts
      - src/ui/src/core/stores/OllamaModelStore*
      - src/ui/src/pages/SettingsPage/components/ollama/OllamaModelTracker.tsx
      - src/ui/src/core/hooks/useTimerDuration.ts
      - src/ui/src/core/hooks/TimerDuration.*
      - src/ui/src/pages/BoardPage/components/card/label/**
      - src/ui/src/pages/BoardPage/components/card/action/label/**
      - src/ui/src/pages/BoardPage/components/card/checklist/BoardCardCheckitemTimer.tsx
      - src/ui/src/pages/DashboardPage/components/TrackingRow.tsx
      - src/ui/playwright.attachment-upload.config.ts
      - src/ui/src/pages/BoardPage/components/card/action/file/**
      - src/ui/playwright.timer-duration.config.ts
      - src/ui/src/core/injection/StringExtensions.ts
      - src/ui/src/core/providers/AuthProvider.tsx
      - src/ui/src/core/providers/AuthLanguage*
      - src/ui/src/core/stores/AuthStore.ts
      - src/ui/src/components/LanguageSwitcher/**
      - src/ui/src/pages/AccountPage/components/preference/PreferenceLanguage*
      - src/ui/scripts/verify-ui-strings*
      - src/ui/scripts/ui-strings-baseline.json
      - src/ui/scripts/i18n-initialization.test.mjs
      - src/ui/scripts/verify-locale-resources.mjs
      - src/ui/playwright.locale-runtime.config.ts
      - src/ui/playwright.locale-format.config.ts
      - src/ui/playwright.error-locale.config.ts
      - src/ui/src/pages/SettingsPage/ProjectTemplates*
      - src/ui/playwright.template-editor.config.ts
      - src/ui/playwright.retrieval.config.ts
      - src/ui/src/pages/SettingsPage/components/internalBots/DocumentRetrievalSettings*
      - src/ui/src/pages/SettingsPage/components/internalBots/retrieval-settings.fixture*
      - src/ui/playwright.workbench.config.ts
      - src/ui/src/components/Layout/workbench-shell.spec.ts
      - src/ui/playwright.explorer-recovery.config.ts
      - src/ui/playwright.card-description-static.config.ts
      - src/ui/playwright.table-selection.config.ts
      - src/ui/playwright.recent-cards.config.ts
      - src/ui/playwright.command-context.config.ts
      - src/ui/playwright.chat-recovery.config.ts
      - src/ui/vite.chat-recovery.config.ts
      - src/ui/playwright.board-chat-stability.config.ts
      - src/ui/vite.board-chat-stability.config.ts
      - src/ui/playwright.default-language.config.ts
      - src/ui/playwright.auth-language.config.ts
      - src/ui/playwright.filter.config.ts
      - src/ui/playwright.project-load.config.ts
      - src/ui/src/controllers/api/board/useGetProject*
      - src/ui/src/controllers/api/board/project-membership.fixture.*
      - src/ui/src/controllers/socket/dashboard/project/useDashboardProjectAssignedUsersUpdatedHandlers.ts
      - src/ui/vite.card-load.config.ts
      - src/ui/package.json
      - src/ui/yarn.lock
      - src/shared/ts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resources-and-runtime:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - name: Prepare Node.js for Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Corepack for Yarn cache
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: src/ui/yarn.lock
      - run: corepack enable
      - run: yarn install --frozen-lockfile
        working-directory: src/shared/ts
      - run: yarn build
        working-directory: src/shared/ts
      - run: yarn install --frozen-lockfile
        working-directory: src/ui
      - run: node --test scripts/i18n-initialization.test.mjs
        working-directory: src/ui
      - run: node --test scripts/verify-ui-strings.test.mjs
        working-directory: src/ui
      - run: node scripts/verify-ui-strings.mjs
        working-directory: src/ui
      - run: node scripts/verify-core-package.mjs
        working-directory: src/ui
      - run: node --experimental-strip-types scripts/verify-locale-resources.mjs --complete
        working-directory: src/ui
      - run: node --experimental-strip-types --test src/core/utils/LocalePolicy.test.ts src/core/utils/LocaleFormat.test.ts
        working-directory: src/ui
      - run: node --experimental-strip-types --test src/pages/BoardPage/components/card/label/LabelCollaboration.test.ts
        working-directory: src/ui
      - run: yarn test:store-snapshots
        working-directory: src/ui
      - run: yarn test:ollama-model-store
        working-directory: src/ui
      - run: yarn playwright install --with-deps chrome
        working-directory: src/ui
      - run: yarn playwright test -c playwright.card-deeplink.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      # Full cross-feature regression remains available through explicit manual dispatch.
      - run: yarn playwright test -c playwright.locale-runtime.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.default-language.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.auth-language.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.timer-duration.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.locale-format.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.template-editor.config.ts --workers=1
        working-directory: src/ui
      - run: yarn playwright test -c playwright.retrieval.config.ts --workers=1
        working-directory: src/ui

      - run: yarn playwright test -c playwright.filter.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.workflow-filter-refresh.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.workflow-stages.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.inline-deadline.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.auth-api.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.project-load.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.route-load.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.notification-load.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.template-selection.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.workload.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.workbench.config.ts -g 'settings storage|explicit sidebar preference|sidebar preference belongs'
        if: github.event_name != 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.workbench.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: node --experimental-strip-types --test src/controllers/api/dashboard/projectWorkloadSubscriptions.test.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.explorer-recovery.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.card-description-static.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.table-selection.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.recent-cards.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: node --experimental-strip-types --test src/pages/BoardPage/components/card/CardFlipStore.test.ts src/pages/BoardPage/components/card/CardFlipDraftStore.test.ts
        working-directory: src/ui

      - run: yarn playwright test -c playwright.error-locale.config.ts
        working-directory: src/ui

      - run: yarn playwright test -c playwright.command-context.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.chat-recovery.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.board-chat-stability.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.attachment-upload.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
