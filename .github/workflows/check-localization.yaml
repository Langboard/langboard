name: Check Localization

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-localization.yaml
      - src/ui/src/**/*.ts
      - src/ui/src/**/*.tsx
      - src/ui/src/controllers/socket/wiki/wikiSummaryInvalidation.test.mjs
      - src/ui/src/controllers/socket/wiki/wikiDerivedReads.test.mjs
      - src/ui/src/assets/locales/**
      - src/ui/src/i18n.ts
      - src/ui/src/constants.ts
      - src/ui/src/core/utils/LocalePolicy*
      - src/ui/src/core/utils/LocaleRuntime*
      - src/ui/src/core/utils/LocaleFormat*
      - src/ui/src/core/hooks/useUpdateDateDistance.ts
      - src/ui/src/core/stores/McpToolStore.ts
      - src/ui/src/core/stores/BotStatusStore.ts
      - src/ui/src/core/stores/EditorStore.ts
      - src/ui/src/core/stores/UserSettingsStore.ts
      - src/ui/src/core/stores/StoreSnapshot.test.ts
      - src/ui/src/core/stores/OllamaModelStore*
      - src/ui/src/pages/SettingsPage/components/ollama/OllamaModelTracker.tsx
      - src/ui/src/core/hooks/useTimerDuration.ts
      - src/ui/src/core/hooks/TimerDuration.*
      - src/ui/src/pages/BoardPage/components/card/label/**
      - src/ui/src/pages/BoardPage/components/card/action/label/**
      - src/ui/src/pages/BoardPage/components/card/checklist/BoardCardCheckitemTimer.tsx
      - src/ui/src/pages/DashboardPage/components/TrackingRow.tsx
      - src/api/langboard/mcp_integration/work_plan.html
      - src/ui/playwright.mcp-work-plan.config.ts
      - src/ui/playwright.mcp-connection.config.ts
      - src/ui/src/pages/BoardPage/components/mcp/**
      - src/ui/playwright.bot-avatar.config.ts
      - src/ui/playwright.editor-ref.config.ts
      - src/ui/playwright.attachment-upload.config.ts
      - src/ui/src/pages/BoardPage/components/card/action/file/**
      - src/ui/playwright.timer-duration.config.ts
      - src/ui/src/core/injection/StringExtensions.ts
      - src/ui/src/core/providers/AuthProvider.tsx
      - src/ui/src/core/providers/AuthLanguage*
      - src/ui/src/core/providers/AuthRecovery*
      - src/ui/playwright.auth-recovery.config.ts
      - src/ui/src/core/stores/AuthStore.ts
      - src/ui/src/components/LanguageSwitcher/**
      - src/ui/src/pages/AccountPage/components/preference/PreferenceLanguage*
      - src/ui/scripts/verify-ui-strings*
      - src/ui/scripts/ui-strings-baseline.json
      - src/ui/scripts/i18n-initialization.test.mjs
      - src/ui/scripts/editor-media-localization.test.cjs
      - src/ui/scripts/verify-locale-resources.mjs
      - src/ui/playwright.locale-runtime.config.ts
      - src/ui/playwright.locale-format.config.ts
      - src/ui/playwright.error-locale.config.ts
      - src/ui/src/pages/SettingsPage/ProjectTemplates*
      - src/ui/playwright.template-editor.config.ts
      - src/ui/playwright.retrieval.config.ts
      - src/ui/src/pages/SettingsPage/components/internalBots/DocumentRetrievalSettings*
      - src/ui/src/pages/SettingsPage/components/internalBots/retrieval-settings.fixture*
      - src/ui/playwright.responsive-comments.config.ts
      - src/ui/playwright.workbench.config.ts
      - src/ui/playwright.group-directory.config.ts
      - src/ui/playwright.change-counts.config.ts
      - src/ui/playwright.changes-native-query.config.ts
      - src/ui/playwright.cmdk-native-query.config.ts
      - src/ui/playwright.workbench-status.config.ts
      - src/ui/playwright.wiki-summary.config.ts
      - src/ui/playwright.my-work-context.config.ts
      - src/api/tests/fixtures/my_work_workspace_server.py
      - src/api/tests/test_dashboard_my_work.py
      - src/ui/playwright.schedule-workload.config.ts
      - src/ui/playwright.board-automation-runs.config.ts
      - src/ui/src/components/Layout/automation-runs.*
      - src/ui/src/pages/BoardPage/BoardAutomationRuns.tsx
      - src/ui/src/components/Layout/schedule-workload.spec.ts
      - src/ui/src/components/Layout/workbench-shell.spec.ts
      - src/ui/playwright.explorer-recovery.config.ts
      - src/ui/playwright.card-description-static.config.ts
      - src/ui/playwright.table-selection.config.ts
      - src/ui/playwright.recent-cards.config.ts
      - src/ui/playwright.command-context.config.ts
      - src/ui/playwright.chat-recovery.config.ts
      - src/ui/vite.chat-recovery.config.ts
      - src/ui/playwright.board-chat-stability.config.ts
      - src/ui/vite.board-chat-stability.config.ts
      - src/ui/playwright.default-language.config.ts
      - src/ui/playwright.auth-language.config.ts
      - src/ui/playwright.board-add-card-draft.config.ts
      - src/ui/playwright.filter.config.ts
      - src/ui/playwright.project-load.config.ts
      - src/ui/src/controllers/api/board/useGetProject*
      - src/ui/src/controllers/api/board/project-membership.fixture.*
      - src/ui/src/controllers/socket/dashboard/project/useDashboardProjectAssignedUsersUpdatedHandlers.ts
      - src/ui/vite.card-load.config.ts
      - src/ui/package.json
      - src/ui/yarn.lock
      - src/shared/ts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  resources-and-runtime:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - name: Prepare Node.js for Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Corepack for Yarn cache
        run: corepack enable
      - name: Restore Yarn cache
        uses: actions/setup-node@v4
        with:
          cache: yarn
          cache-dependency-path: |
            src/shared/ts/yarn.lock
            src/ui/yarn.lock
      - run: yarn install --frozen-lockfile
        working-directory: src/shared/ts
      - run: yarn build
        working-directory: src/shared/ts
      - run: yarn install --frozen-lockfile --network-concurrency 4 --network-timeout 120000
        working-directory: src/ui
      - run: node scripts/verify-ui-strings.mjs
        working-directory: src/ui
      - run: node --test scripts/i18n-initialization.test.mjs
        working-directory: src/ui
      - run: node scripts/editor-media-localization.test.cjs
        working-directory: src/ui
      - run: node --test scripts/verify-ui-strings.test.mjs
        working-directory: src/ui
      - run: node scripts/verify-core-package.mjs
        working-directory: src/ui
      - run: node --experimental-strip-types scripts/verify-locale-resources.mjs --complete
        working-directory: src/ui
      - run: yarn test:schedule-admission
        working-directory: src/ui
      - run: node --experimental-strip-types --test src/core/utils/LocalePolicy.test.ts src/core/utils/LocaleFormat.test.ts src/core/helpers/setupApiErrorHandler.test.ts src/components/Editor/useChat.test.ts
        working-directory: src/ui
      - run: node --experimental-strip-types --test src/pages/BoardPage/components/card/label/LabelCollaboration.test.ts
        working-directory: src/ui
      - name: Verify native Markdown attachment roundtrip and text fallback
        run: node --experimental-strip-types --test src/components/Editor/plugins/markdown/escape-angles.test.ts src/components/Editor/plugins/markdown/escape.test.ts
        working-directory: src/ui
      - name: Verify board deadline calendar and warning policies
        run: node --experimental-strip-types --test src/pages/BoardPage/components/board/BoardDeadlineFilter.test.ts src/pages/BoardPage/components/board/BoardColumnCardStatus.test.ts src/pages/DashboardPage/components/ProjectWorkload.test.ts
        working-directory: src/ui
      - run: yarn test:card-draft-store
        working-directory: src/ui
      - run: yarn test:store-snapshots
        working-directory: src/ui
      - run: yarn test:ollama-model-store
        working-directory: src/ui
      - name: Verify native socket dispatch and scoped observers
        run: yarn test:socket-runtime
        working-directory: src/ui
      - name: Verify summary invalidation and native relationship sequencing
        run: |
          node --experimental-strip-types --test src/controllers/api/WorkspaceSummaryInvalidation.test.ts src/controllers/socket/card/useCardRelationshipsUpdatedHandlers.test.mjs src/controllers/socket/wiki/wikiSummaryInvalidation.test.mjs src/controllers/socket/wiki/wikiDerivedReads.test.mjs
        working-directory: src/ui
      - run: yarn playwright install --with-deps chrome
        working-directory: src/ui
      - name: Verify bot avatar consent and actor isolation
        run: yarn playwright test -c playwright.bot-avatar.config.ts
        working-directory: src/ui
      - name: Verify reviewed MCP plan creation fields and read-only bridge
        run: yarn playwright test -c playwright.mcp-work-plan.config.ts
        working-directory: src/ui
      - name: Verify MCP client installation and separate board consent
        run: yarn playwright test -c playwright.mcp-connection.config.ts
        working-directory: src/ui
      - name: Verify native editor selection and clipboard replacement
        run: yarn playwright test -c playwright.editor-ref.config.ts --workers=1
        working-directory: src/ui
      - name: Verify native new-card title and body draft recovery
        run: yarn playwright test -c playwright.board-add-card-draft.config.ts
        working-directory: src/ui
      - name: Verify Explorer interactions preserve the open card
        run: yarn playwright test -c playwright.card-deeplink.config.ts --grep "sidebar collapse and expansion preserve|sidebar icon pointer targets|visual blank area dismisses" --workers=1
        if: github.event_name != 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.card-deeplink.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      # Full cross-feature regression remains available through explicit manual dispatch.
      - run: yarn playwright test -c playwright.locale-runtime.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.default-language.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.auth-language.config.ts
        working-directory: src/ui
      - name: Verify rendered authentication recovery and route changes
        run: yarn playwright test -c playwright.auth-recovery.config.ts --workers=1
        working-directory: src/ui
      - run: yarn playwright test -c playwright.timer-duration.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.locale-format.config.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.template-editor.config.ts --workers=1
        working-directory: src/ui
      - run: yarn playwright test -c playwright.retrieval.config.ts --workers=1
        working-directory: src/ui

      - run: yarn playwright test -c playwright.filter.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.workflow-filter-refresh.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.workflow-stages.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.inline-deadline.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.auth-api.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.project-load.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.route-load.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.notification-load.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.template-selection.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.workload.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.workbench.config.ts -g 'settings storage|explicit sidebar preference|sidebar preference belongs'
        if: github.event_name != 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.workbench.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - name: Verify native Users and Groups permission isolation
        run: yarn playwright test -c playwright.group-directory.config.ts
        working-directory: src/ui
      - name: Verify native responsive comment editing and attachment preservation
        run: yarn playwright test -c playwright.responsive-comments.config.ts
        working-directory: src/ui
      - name: Verify authoritative counts and Changes native query lifecycle
        if: github.event_name == 'workflow_dispatch'
        # This config includes changes-native-query.spec.ts; do not run its standalone config again.
        run: yarn playwright test -c playwright.change-counts.config.ts
        working-directory: src/ui
      - name: Verify CmdK native query lifecycle
        if: github.event_name == 'workflow_dispatch'
        run: yarn playwright test -c playwright.cmdk-native-query.config.ts
        working-directory: src/ui
      - name: Verify narrow Workbench status accessibility
        if: github.event_name == 'workflow_dispatch'
        # The full Workbench run above already covers the shared transport footer regression.
        run: yarn playwright test -c playwright.workbench-status.config.ts workbench-status.spec.ts
        working-directory: src/ui
      - run: node --experimental-strip-types --test src/controllers/api/dashboard/projectWorkloadSubscriptions.test.ts
        working-directory: src/ui
      - name: Verify My Work response and pane ownership
        run: node --experimental-strip-types --test src/pages/BoardPage/components/board/MyWorkWorkspaceFilter.test.ts src/pages/DashboardPage/my-work-context/MyWorkContext.test.ts
        working-directory: src/ui
      - run: yarn playwright test -c playwright.explorer-recovery.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.card-description-static.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.table-selection.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.recent-cards.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: node --experimental-strip-types --test src/pages/BoardPage/components/card/CardFlipStore.test.ts src/pages/BoardPage/components/card/CardFlipDraftStore.test.ts
        working-directory: src/ui

      - run: yarn playwright test -c playwright.error-locale.config.ts
        working-directory: src/ui

      - run: yarn playwright test -c playwright.command-context.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.chat-recovery.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - run: yarn playwright test -c playwright.board-chat-stability.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui

      - run: yarn playwright test -c playwright.attachment-upload.config.ts
        if: github.event_name == 'workflow_dispatch'
        working-directory: src/ui
      - name: Verify Schedule views and session boundaries
        if: github.event_name == 'workflow_dispatch'
        run: yarn playwright test -c playwright.schedule-workload.config.ts
        working-directory: src/ui
      - name: Verify native Automation run boundaries
        if: github.event_name == 'workflow_dispatch'
        run: yarn playwright test -c playwright.board-automation-runs.config.ts
        working-directory: src/ui
      - name: Verify bounded Wiki metadata and lazy Relations trees
        if: github.event_name == 'workflow_dispatch'
        run: |
          yarn playwright test -c playwright.wiki-summary.config.ts
          yarn playwright test -c src/pages/BoardPage/components/board/relations-tree-tests/playwright.config.ts
        working-directory: src/ui
      - uses: astral-sh/setup-uv@v6
        if: github.event_name == 'workflow_dispatch'
        with:
          enable-cache: true
      - uses: actions/setup-python@v5
        if: github.event_name == 'workflow_dispatch'
        with:
          python-version: "3.12"
      - name: Prepare native My Work fixture dependencies
        if: github.event_name == 'workflow_dispatch'
        run: uv sync --locked --extra keyword-search
      - name: Verify My Work native HTTP and workspace behavior
        if: github.event_name == 'workflow_dispatch'
        run: yarn playwright test -c playwright.my-work-context.config.ts
        working-directory: src/ui
