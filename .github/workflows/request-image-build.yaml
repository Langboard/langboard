name: Request Image Build
run-name: "Image build request: ${{ github.sha }}"

on:
  push:
    branches: ["deploy/**", "review/canary-*"]
    paths:
      - .github/workflows/**
      - scripts/image_build/**
      - .fractalops/image-build.json
      - Dockerfile
      - docker/ui-production.Dockerfile
      - src/**
      - pyproject.toml
      - uv.lock
  workflow_dispatch:
    inputs:
      profile:
        description: Approved image profile
        required: true
        type: choice
        options: [api, worker, ui, socket, graph, default]
      validation_only:
        description: Verify an open same-repository PR without product publication
        required: false
        default: false
        type: boolean
      source_pr:
        description: Current PR number for validation-only execution
        required: false
        default: ""
        type: string

permissions:
  contents: read
  id-token: write
  pull-requests: read

concurrency:
  group: image-build-request-${{ github.ref }}-${{ inputs.profile || 'default' }}
  # Review pushes submit validation only. Do not let an obsolete queued
  # transport hold the latest PR head; product requests remain serialized.
  cancel-in-progress: false

jobs:
  reject-validation-profile:
    if: github.event_name == 'workflow_dispatch' && ((inputs.validation_only == true && inputs.profile != 'default') || (inputs.validation_only != true && inputs.profile == 'default'))
    runs-on: ${{ vars.BUILD_REQUEST_RUNNER || 'fractalops-ci-native' }}
    permissions: {}
    timeout-minutes: 1
    steps:
      - run: |
          echo "::error::Use default for validation-only, a fixed request-validation-<profile>.yaml for runtime validation, or a runtime profile for publication."
          exit 1
  request:
    name: request
    if: (github.event_name == 'push' && startsWith(github.ref, 'refs/heads/review/canary-')) || (github.event_name == 'workflow_dispatch' && inputs.validation_only == true && inputs.profile == 'default' && startsWith(github.ref, 'refs/heads/review/'))
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-review.yml@57ab34c3c62b6a67e88447dac89183dceb61c9a4
    with:
      profile: default
      source_pr: ${{ inputs.source_pr }}
  runtime-api:
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/heads/deploy/') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validation_only != true && inputs.profile == 'api')) }}
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@d7e44e2b2d324df12f912b19319823790b41cbd5
    with:
      profile: api
      source_channel: canary
  runtime-worker:
    needs: [runtime-api]
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/heads/deploy/') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validation_only != true && inputs.profile == 'worker')) }}
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@d7e44e2b2d324df12f912b19319823790b41cbd5
    with:
      profile: worker
      source_channel: canary
  runtime-ui:
    needs: [runtime-worker]
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/heads/deploy/') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validation_only != true && inputs.profile == 'ui')) }}
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@d7e44e2b2d324df12f912b19319823790b41cbd5
    with:
      profile: ui
      source_channel: canary
  runtime-socket:
    needs: [runtime-ui]
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/heads/deploy/') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validation_only != true && inputs.profile == 'socket')) }}
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@d7e44e2b2d324df12f912b19319823790b41cbd5
    with:
      profile: socket
      source_channel: canary
  runtime-graph:
    needs: [runtime-socket]
    if: ${{ !cancelled() && !failure() && startsWith(github.ref, 'refs/heads/deploy/') && (github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.validation_only != true && inputs.profile == 'graph')) }}
    uses: yamonco/yamon-gitops/.github/workflows/remote-project-image.yml@d7e44e2b2d324df12f912b19319823790b41cbd5
    with:
      profile: graph
      source_channel: canary
