name: Check App Contracts

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-app-contracts.yaml
      - .github/workflows/request-image-build.yaml
      - scripts/image_build/**
      - src/api/tests/apps/**
      - src/api/langboard/apps/**
      - src/api/langboard/routes/settings/App*.py
      - src/api/langboard/routes/board/SignalInboxApi.py
      - src/api/langboard/routes/board/App*.py
      - src/api/langboard/routes/board/CardApp*.py
      - src/api/langboard/routes/board/BoardSettingApi.py
      - src/shared/py/langboard_shared/domain/services/App*.py
      - src/shared/py/langboard_shared/domain/services/CardApp*.py
      - src/shared/py/langboard_shared/domain/services/factory/CardService.py
      - src/shared/py/langboard_shared/tasks/webhooks/ExecutionReadinessUow.py
      - src/api/tests/webhooks/test_execution_readiness_uow_postgres.py
      - src/shared/py/langboard_shared/tasks/webhooks/AppEvent*.py
      - src/shared/py/langboard_shared/tasks/webhooks/WebhookTask.py
      - src/shared/py/langboard_shared/tasks/webhooks/utils.py
      - src/shared/py/langboard_shared/domain/models/App*.py
      - src/shared/py/langboard_shared/domain/models/CardApp*.py
      - src/shared/py/langboard_shared/domain/models/BoardAppBinding.py
      - src/api/langboard/migrations/**
      - src/sdk/vendor/**
      - scripts/sdk/verify_python_artifact*.py
      - src/shared/py/pyproject.toml
      - src/shared/py/uv.lock
      - pyproject.toml
      - uv.lock
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: app-contracts-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  native-contracts:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: langboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROJECT_NAME: langboard
      PROJECT_SHORT_NAME: lb
      PYTHONPATH: src/api/tests/apps
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - name: Configure service database
        env:
          POSTGRES_HOST: ${{ job.container.network && 'postgres' || '127.0.0.1' }}
        run: |
          printf 'LANGBOARD_FILE_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@%s:5432/langboard_test\n' "$POSTGRES_HOST" >> "$GITHUB_ENV"
          printf 'LANGBOARD_OUTBOX_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@%s:5432/langboard_test\n' "$POSTGRES_HOST" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify the reviewed SDK before dependency installation
        run: |
          python scripts/sdk/verify_python_artifact.py
          python -m unittest discover -s scripts/sdk -p verify_python_artifact_test.py
      - name: Verify Python standard library database runtime
        run: python -c "import sqlite3; assert sqlite3.connect(':memory:').execute('SELECT 1').fetchone() == (1,)"
      - run: uv sync --frozen
      - name: Verify PostgreSQL service connection
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["LANGBOARD_FILE_TEST_DATABASE_URL"], connect_args={"connect_timeout": 10})
          with engine.connect() as db:
              assert db.execute(text("SELECT 1")).scalar_one() == 1
          engine.dispose()
          PY
      - name: Verify immutable executor request contract
        run: uv run --no-sync python -m unittest discover -s scripts/image_build -v
      - name: Independent signal, Inbox, owned card and human-response contracts
        run: >-
          uv run --no-sync pytest -p no:tach -o log_cli=false -q --junitxml=app-contracts.xml
          src/api/tests/apps/test_signal_inbox.py::test_registered_external_signal_policy_drives_inbox_and_card_evidence
          src/api/tests/apps/test_app_package.py
          src/api/tests/apps/test_app_package_http.py
          src/api/tests/apps/test_workflow_api.py
          src/api/tests/apps/test_workflow_http.py
          src/api/tests/apps/test_external_provider_signal_contracts.py
          src/api/tests/apps/test_app_card_interactions.py
          src/api/tests/apps/test_app_card_creation.py
          src/api/tests/card_visibility/test_creation_visibility.py
          src/api/tests/apps/test_app_card_archive_migration.py
          src/api/tests/apps/test_app_card_archive_delivery.py
          src/api/tests/apps/test_card_app_ownership.py
          src/api/tests/apps/test_connection_ownership_revision.py
          src/api/tests/apps/test_app_event_destination.py
          src/api/tests/apps/test_app_event_delivery.py
          src/api/tests/apps/test_app_event_http.py
          src/api/tests/apps/test_app_execution_control.py
          src/api/tests/webhooks/test_execution_readiness_uow_postgres.py
          src/api/tests/apps/test_app_governance.py
          src/api/tests/apps/test_sdk_app_registry_http.py
          src/api/tests/apps/test_app_composition.py
          src/api/tests/apps/test_binding_storage.py
          src/api/tests/apps/test_sdk_resources_http.py
          src/api/tests/apps/test_registered_connection_context.py
      - name: Preserve contract results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: app-contracts-${{ github.sha }}
          path: app-contracts.xml
          if-no-files-found: warn
          retention-days: 14
