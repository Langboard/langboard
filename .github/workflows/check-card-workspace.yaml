      - src/shared/py/langboard_shared/domain/contracts/content_blocks.py
      - src/api/tests/card_priority/**
      - src/shared/py/langboard_shared/domain/contracts/CardPriority.py
      - src/shared/py/langboard_shared/domain/models/Card.py
      - src/api/langboard/migrations/versions/20261031010000-efab123d4567.py
