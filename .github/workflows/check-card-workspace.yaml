      - src/api/langboard/migrations/versions/20261023010000-c7921d41af65.py
      - src/shared/py/langboard_shared/domain/services/factory/CardRelationshipService.py
      - src/shared/py/langboard_shared/infrastructure/repositories/factory/CardRelationshipRepository.py
      - src/shared/py/langboard_shared/domain/services/factory/ChecklistService.py
      - src/shared/py/langboard_shared/domain/services/factory/CheckitemService.py
      - src/api/tests/card_workspace/timers/**
      - src/shared/py/langboard_shared/infrastructure/repositories/factory/CheckitemTimerRecordRepository.py
      - src/shared/py/langboard_shared/domain/services/factory/ChecklistService_batch_test.py
      - src/shared/py/langboard_shared/domain/services/factory/CardContentBlockService.py
      - src/shared/py/langboard_shared/domain/services/factory/CardContentBlockService_batch_test.py
      - src/shared/py/langboard_shared/infrastructure/repositories/factory/CardContentBlockRepository.py
      - src/shared/py/langboard_shared/infrastructure/repositories/factory/CheckitemRepository.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: card-workspace-contract
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    # Keep the full PostgreSQL and SQLite contract suite within the job budget.
    timeout-minutes: 45
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: langboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d langboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROJECT_NAME: langboard
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl ffmpeg git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - name: Configure service database
        env:
          POSTGRES_HOST: ${{ job.container.network && 'postgres' || '127.0.0.1' }}
        run: |
          printf 'LANGBOARD_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@%s:5432/langboard_test\n' "$POSTGRES_HOST" >> "$GITHUB_ENV"
          printf 'LANGBOARD_FILE_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@%s:5432/langboard_test\n' "$POSTGRES_HOST" >> "$GITHUB_ENV"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # PR checks restore caches; manual runs can warm them without blocking review.
          save-cache: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --locked --extra keyword-search --extra image-generation
      - run: bash scripts/check-card-workspace.sh
