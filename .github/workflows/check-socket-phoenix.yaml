name: Check Phoenix Socket

on:
  push:
    branches: [main, "deploy/**"]
    paths: &phoenix_paths
      - ".env.example"
      - "Makefile"
      - "pyproject.toml"
      - "uv.lock"
      - "docker/**"
      - "scripts/**"
      - "src/api/langboard/**"
      - "src/api/tests/**"
      - "src/shared/py/**"
      - "src/socket/**"
      - "src/shared/realtime/**"
      - "src/shared/ts/**"
      - "src/ui/**"
      - ".github/workflows/check-socket-phoenix.yaml"
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft, closed]
    paths: *phoenix_paths
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: phoenix-socket-${{ github.event.number || github.ref_name }}
  cancel-in-progress: true

env:
  MIX_ENV: test
  PROJECT_NAME: langboard
  PROJECT_SHORT_NAME: lb

jobs:
  check:
    if: vars.CI_RUNNER != '' && (github.event_name != 'pull_request' || (github.event.pull_request.state == 'open' && github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: hexpm/elixir:1.19.5-erlang-28.5.0.5-debian-bookworm-20260824-slim@sha256:6eed5992d974265841fd43857e21236d3c5a700de70caaff234b74f6682921fd
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
        working-directory: .
    steps:
      - name: Prepare standard job tools
        working-directory: .
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ca-certificates curl git libncurses6 libsctp1 libsqlite3-0 libssl-dev tar unzip xz-utils
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Initialize pinned BEAM tooling
        run: |
          elixir --version
          mix local.hex --force
          mix local.rebar --force
      - name: Identify Phoenix dependency lock
        id: phoenix_lock
        run: |
          phoenix_sha256=$(sha256sum src/socket/mix.lock | cut -d ' ' -f 1)
          python_sha256=$(sha256sum uv.lock pyproject.toml | sha256sum | cut -d ' ' -f 1)
          echo "sha256=$phoenix_sha256" >> "$GITHUB_OUTPUT"
          echo "python_sha256=$python_sha256" >> "$GITHUB_OUTPUT"
      - uses: actions/cache@v4
        with:
          path: src/socket/deps
          key: phoenix-deps-${{ runner.os }}-28.5.0.5-1.19.5-${{ steps.phoenix_lock.outputs.sha256 }}
      - name: Install Phoenix dependencies
        env:
          HEX_HTTP_CONCURRENCY: "4"
          HEX_HTTP_TIMEOUT: "120"
        run: cd src/socket && mix deps.get --check-locked
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v4
        with:
          path: |
            ~/.cache/uv
            .venv
          key: phoenix-uv-${{ runner.os }}-${{ steps.phoenix_lock.outputs.python_sha256 }}
          restore-keys: phoenix-uv-${{ runner.os }}-
      - name: Install Python dependencies
        run: |
          uv python install 3.12
          uv sync --frozen
        working-directory: .
      - name: Run Python static checks
        env:
          UV_NO_SYNC: "true"
        run: make check_socket_phoenix_python
        working-directory: .
      - name: Enable locked Yarn Classic
        run: |
          corepack enable
          corepack prepare yarn@1.22.22 --activate
        working-directory: .
      - name: Install and build shared TypeScript dependencies
        working-directory: src/shared/ts
        run: |
          yarn install --frozen-lockfile --ignore-scripts --network-concurrency 4 --network-timeout 120000
          yarn build
      - name: Install UI dependencies
        working-directory: src/ui
        run: yarn install --frozen-lockfile --ignore-scripts --network-concurrency 4 --network-timeout 120000
      - name: Run the cross-runtime migration gate
        env:
          UV_NO_SYNC: "true"
        run: make test_socket_phoenix_runtime
        working-directory: .
      - name: Distributed editor recovery
        run: cd src/socket && elixir --sname editor_cluster_probe -S mix run test/integration/editor_cluster_probe.exs
      - name: Strict code analysis
        run: cd src/socket && mix credo --strict
      - uses: actions/cache/restore@v4
        id: plt
        with:
          path: src/socket/_build/plts
          key: phoenix-plt-${{ runner.os }}-28.5.0.5-1.19.5-${{ steps.phoenix_lock.outputs.sha256 }}
          restore-keys: phoenix-plt-${{ runner.os }}-28.5.0.5-1.19.5-
      - name: Build analysis cache
        run: cd src/socket && mix dialyzer --plt
      - uses: actions/cache/save@v4
        if: steps.plt.outputs.cache-hit != 'true'
        with:
          path: src/socket/_build/plts
          key: phoenix-plt-${{ runner.os }}-28.5.0.5-1.19.5-${{ steps.phoenix_lock.outputs.sha256 }}
      - name: Type analysis
        run: cd src/socket && mix dialyzer --format github --format dialyxir
