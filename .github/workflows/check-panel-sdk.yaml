name: Check App Panel SDK
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-panel-sdk.yaml
      - src/sdk/vendor/**
      - src/ui/package.json
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 10
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check pinned independent SDK package
        run: |
          node --input-type=module <<'NODE'
          import {readFileSync, mkdirSync} from 'node:fs';
          import {resolve, basename} from 'node:path';
          import {createHash} from 'node:crypto';
          import {execFileSync} from 'node:child_process';
          const declared = JSON.parse(readFileSync('src/ui/package.json')).dependencies['@langboard/app-panel'];
          if (!/^file:\.\.\/sdk\/vendor\/langboard-app-panel-[0-9]+\.[0-9]+\.[0-9]+\.tgz$/.test(declared)) throw Error('Invalid panel artifact');
          const artifact = resolve('src/ui', declared.slice(5));
          const provenance = JSON.parse(readFileSync('src/sdk/vendor/provenance.json'));
          if (createHash('sha256').update(readFileSync(artifact)).digest('hex') !== provenance.artifacts[basename(artifact)]) throw Error('Panel digest mismatch');
          mkdirSync('consumer');
          execFileSync('npm', ['install', '--ignore-scripts', '--no-audit', '--no-fund', artifact], {cwd: 'consumer', stdio: 'inherit'});
          const installed = JSON.parse(readFileSync('consumer/node_modules/@langboard/app-panel/package.json'));
          if (installed.version !== provenance.packages['@langboard/app-panel']) throw Error('Panel version mismatch');
          const {PanelStateCache, createPanelHost, connectPanel} = await import('./consumer/node_modules/@langboard/app-panel/index.mjs');
          const {createSignalInbox} = await import('./consumer/node_modules/@langboard/app-panel/inbox.mjs');
          if ([createPanelHost, connectPanel, createSignalInbox].some(value => typeof value !== 'function')) throw Error('Missing panel contract');
          new PanelStateCache();
          NODE
