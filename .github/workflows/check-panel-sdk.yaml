name: Check App Panel SDK
on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-panel-sdk.yaml
      - src/sdk/vendor/**
      - scripts/sdk/check_panel_artifact.mjs
      - scripts/sdk/check_panel_artifact.test.mjs
      - scripts/sdk/read_host.py
      - scripts/sdk/read_host_test.py
      - src/ui/package.json
      - src/ui/yarn.lock
      - src/ui/vite.panelSdkMetadata*
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  protocol:
    if: github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository)
    timeout-minutes: 10
    runs-on: fractalops-ci-native
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22.23.4"
      - name: Check installed SDK export metadata
        run: node --test src/ui/vite.panelSdkMetadata.test.mjs
      - name: Check pinned independent SDK package
        run: node --test scripts/sdk/check_panel_artifact.test.mjs
      - name: Check public host diagnostic receipts
        run: python3 -m unittest discover -s scripts/sdk -p read_host_test.py
