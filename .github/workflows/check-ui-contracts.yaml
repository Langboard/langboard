      - src/ui/src/assets/styles/main.css
      - src/ui/src/components/base/Dialog/index.tsx
      - src/ui/src/pages/BoardPage/BoardCardPage.tsx
      - src/ui/src/pages/BoardPage/components/card/BoardCardDescription.tsx
      - src/ui/src/core/stores/CardDraftStore.ts
      - src/ui/src/pages/BoardPage/components/card/cardDraftClose.*
      - src/ui/src/pages/BoardPage/components/card/fullEditSave.*
      - src/ui/playwright.card-draft-close.config.ts
      - src/ui/vite.card-draft-close.config.ts
      - src/ui/playwright.collaborative-draft.config.ts
      - src/ui/vite.collaborative-fixture.config.ts
      - src/ui/scripts/collaborative-fixture-server.mjs
      - src/ui/scripts/run-collaborative-owner.mjs
      - src/ui/src/controllers/api/editor/**
      - src/socket/**
      - src/ui/src/components/Editor/collaborative-*
      - src/ui/src/components/Editor/plugins/yjs-kit.tsx
      - src/ui/src/components/Collaborative/**
      - src/ui/src/components/Editor/prepareRichDraftPatch.ts
      - src/ui/playwright.card-timeline.config.ts
      - src/ui/scripts/card-timeline-sync-fixture.mjs
      - src/ui/src/components/Layout/card-timeline.*
      - src/ui/src/pages/BoardPage/index.tsx
      - src/ui/src/pages/BoardPage/BoardAutomationRuns.tsx
      - src/ui/src/pages/BoardPage/components/board/BoardColumnCardCollapsible.tsx
      - src/ui/src/pages/BoardPage/components/board/CardAnimation.*
      - src/ui/src/pages/BoardPage/components/board/CardViewerDeepLink.*
      - .github/workflows/check-comment-panel-resize.yaml
      - src/ui/src/core/providers/BoardCardProvider.tsx
      - src/ui/src/pages/BoardPage/components/card/checklist/BoardCardChecklist.tsx
      - src/ui/src/pages/BoardPage/components/card/checklist/BoardCardCheckitem.tsx
      - src/ui/scripts/checklist-drag-permission.test.mjs
      - src/ui/src/pages/BoardPage/components/card/BoardCard.tsx
      - src/ui/src/pages/BoardPage/components/card/comment/CommentPanelWidth.*
      - .github/workflows/check-reaction-ui.yaml
      - src/ui/src/components/base/Dock/**
      - src/ui/src/components/ReactionCounter/**
      - src/ui/src/pages/BoardPage/components/card/comment/BoardCommentReaction.tsx
      - src/shared/ts/src/constants/SocketEvents.ts
      - src/ui/src/core/models/ProjectCard.ts
      - src/ui/src/controllers/socket/card/useCardDetailsChangedHandlers.ts
      - src/ui/src/core/providers/BoardProvider.tsx
      - src/ui/src/pages/BoardPage/components/board/crossBoard/**
      - src/ui/src/pages/BoardPage/components/card/mirror/**
      - src/ui/src/pages/BoardPage/components/cloud/**
      - src/ui/src/components/ImagePreviewDialog/**
      - src/ui/src/pages/SettingsPage/WorkflowEffectHistory.tsx
      - src/ui/src/pages/SettingsPage/WorkflowStages.*
      - src/ui/src/pages/DashboardPage/components/ProjectCollection*
      - src/ui/src/pages/DashboardPage/components/useProjectCollections.ts
      - src/ui/playwright.board-resources.config.ts
      - src/ui/src/controllers/socket/card/checklist/useBoardChecklistProgressChangedHandlers.ts
      - src/ui/src/pages/BoardPage/components/board/BoardColumnCardStatus.*
      - src/ui/src/pages/BoardPage/components/card/BoardCardDeadline.tsx
      - src/ui/src/pages/BoardPage/components/card/CardColumnHistory.tsx
      - src/ui/src/pages/BoardPage/components/card/CardColumnEvent.tsx
      - .github/workflows/check-ui-contracts.yaml
      - src/ui/package.json
      - src/ui/scripts/verify-core-package.mjs
      - src/ui/eslint.config.js
      - src/ui/yarn.lock
      - src/ui/src/pages/BoardPage/components/board/BoardSchedule*.ts*
      - src/ui/src/controllers/api/dashboard/useGetSchedule*.ts
      - src/ui/playwright.card-decision.config.ts
      - src/ui/playwright.personal-signal-inbox.config.ts
      - src/ui/playwright.user-login-range.config.ts
      - src/ui/playwright.settings-mail.config.ts
      - src/ui/src/pages/SettingsPage/MailSettings*
      - src/ui/src/pages/SettingsPage/MailTestMessage.tsx
      - src/ui/src/pages/SettingsPage/MailDeliveryHistory.tsx
      - src/ui/src/assets/locales/*/settings.json
      - src/ui/playwright.filter.config.ts
      - src/ui/src/pages/BoardPage/components/board/BoardFilter*
      - src/ui/src/pages/BoardPage/components/board/useBoardFilterPreferences.ts
      - src/ui/src/pages/DashboardPage/PersonalSignalInbox*
      - src/ui/src/pages/BoardPage/components/board/SignalInboxPanel*
      - src/ui/src/pages/SettingsPage/components/users/UserList*
      - src/ui/src/pages/SettingsPage/components/users/UserDetails.tsx
      - src/ui/src/pages/SettingsPage/components/users/user-detail-session.fixture.*
      - src/ui/src/pages/SettingsPage/components/users/UserBusinessActivity.tsx
      - src/ui/src/pages/SettingsPage/components/users/UserEffectivePermissions.tsx
      - src/ui/src/controllers/api/settings/users/useUserEffectivePermissions.ts
      - src/ui/src/controllers/api/card/useSearchCardContext.ts
      - src/ui/src/pages/SettingsPage/components/users/user-effective-permissions.spec.ts
      - src/ui/src/controllers/api/settings/users/useUserBusinessActivity.ts
      - src/ui/src/pages/SettingsPage/components/users/userLoginRange.ts
      - src/ui/src/pages/SettingsPage/components/users/user-login-range.spec.ts
      - src/ui/src/pages/SettingsPage/components/users/user-business-activity.spec.ts
      - src/ui/src/pages/DashboardPage/index.tsx
      - src/ui/src/pages/DashboardPage/Route.tsx
      - src/ui/src/core/routing/constants.ts
      - src/ui/playwright.wiki-secret-selection.config.ts
      - src/ui/vite.config.ts
      - src/ui/src/pages/BoardPage/components/card/decision/**
      - src/ui/src/pages/BoardPage/components/card/action/decision/**
      - src/ui/src/components/Editor/**
      - src/ui/src/components/plate-ui/**
      - src/ui/src/core/providers/EditorDataProvider.tsx
      - src/ui/src/core/providers/BoardWikiProvider.tsx
      - src/ui/src/core/stores/AuthStore.ts
      - src/ui/src/core/helpers/Api.ts
      - src/ui/src/core/models/ProjectWiki.ts
      - src/ui/src/core/models/GraphApprovalRequestModel.ts
      - src/ui/src/core/utils/SecretReferenceLink.ts
      - src/ui/src/controllers/api/wiki/**
      - src/ui/src/pages/BoardPage/components/wiki/**
      - src/ui/src/assets/locales/*/card.json
      - src/ui/src/assets/locales/*/wiki.json
      - src/shared/ts/**
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  ui-contracts:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    # Allow the full browser suite and failure evidence upload to finish.
    timeout-minutes: 40
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: hexpm/elixir:1.19.5-erlang-28.5.0.5-debian-bookworm-20260824-slim@sha256:6eed5992d974265841fd43857e21236d3c5a700de70caaff234b74f6682921fd
    env:
      MIX_ENV: test
    defaults:
      run:
        shell: bash
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends build-essential cmake ca-certificates curl git libncurses6 libsctp1 libsqlite3-0 libssl-dev tar unzip xz-utils
      - uses: actions/checkout@v4
      - name: Prepare native Phoenix fixture tooling
        run: |
          elixir --version
          mix local.hex --force
          mix local.rebar --force
      - uses: actions/cache@v4
        with:
          path: src/socket/deps
          key: ui-owner-deps-${{ runner.os }}-28.5.0.5-1.19.5-${{ hashFiles('src/socket/mix.lock') }}
      - name: Prepare the locked native collaborative owner
        working-directory: src/socket
        env:
          HEX_HTTP_CONCURRENCY: "4"
          HEX_HTTP_TIMEOUT: "120"
        run: |
          mix deps.get --check-locked
          mix compile --warnings-as-errors
      - name: Prepare Node.js for Yarn cache
        uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Prepare Corepack for Yarn cache
        run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: yarn
          cache-dependency-path: src/ui/yarn.lock
      - name: Install and build shared TypeScript dependencies
        working-directory: src/shared/ts
        run: |
          yarn install --frozen-lockfile --ignore-scripts --network-concurrency 4 --network-timeout 120000
          yarn build
      - run: yarn install --frozen-lockfile
        working-directory: src/ui
      - name: Verify prepared shared TypeScript exports
        run: node scripts/verify-core-package.mjs
        working-directory: src/ui
      - name: Lint board, animation, comment resize and reaction contracts
        run: yarn eslint src/components/base/Dialog/index.tsx src/pages/BoardPage/BoardCardPage.tsx src/pages/BoardPage/index.tsx src/pages/BoardPage/BoardAutomationRuns.tsx src/pages/BoardPage/components/board/BoardColumnCardCollapsible.tsx src/pages/BoardPage/components/board/CardAnimation.ts src/pages/BoardPage/components/board/CardAnimation.test.ts src/pages/BoardPage/components/board/CardViewerDeepLink.fixture.tsx src/pages/BoardPage/components/board/CardViewerDeepLinkLateChunk.fixture.tsx src/pages/BoardPage/components/board/CardViewerDeepLink.spec.ts src/core/providers/BoardCardProvider.tsx src/pages/BoardPage/components/card/BoardCard.tsx src/pages/BoardPage/components/card/comment/CommentPanelWidth.ts src/pages/BoardPage/components/card/comment/CommentPanelWidth.test.ts src/components/base/Dock/index.tsx src/components/ReactionCounter/index.tsx src/pages/BoardPage/components/card/comment/BoardCommentReaction.tsx src/core/models/ProjectCard.ts src/core/providers/BoardProvider.tsx src/controllers/socket/card/useCardDetailsChangedHandlers.ts src/controllers/socket/card/checklist/useBoardChecklistProgressChangedHandlers.ts src/pages/BoardPage/components/board/BoardColumnCardStatus.ts src/pages/BoardPage/components/board/BoardColumnCardStatus.test.ts src/pages/BoardPage/components/card/BoardCardDeadline.tsx src/pages/BoardPage/components/card/CardColumnHistory.tsx --max-warnings 0
        working-directory: src/ui
      - name: Verify board status, animation and comment resize contracts
        run: node --experimental-strip-types --test src/pages/BoardPage/components/board/CardAnimation.test.ts src/pages/BoardPage/components/card/comment/CommentPanelWidth.test.ts src/pages/BoardPage/components/board/BoardColumnCardStatus.test.ts
        working-directory: src/ui
      - name: Verify local-day Schedule range boundaries
        run: TZ=America/New_York node --experimental-strip-types --test src/pages/BoardPage/components/board/BoardScheduleRange.test.ts
        working-directory: src/ui
      - name: Verify Wiki secret selection offsets and revision hashes
        run: node --experimental-strip-types --test src/components/Editor/wiki-secret-selection.test.ts
        working-directory: src/ui
      - name: Install Playwright Chromium
        run: yarn playwright install --with-deps chromium
        working-directory: src/ui
      - name: Verify checklist drag registration after permission changes
        run: node --test scripts/checklist-drag-permission.test.mjs
        env:
          PLAYWRIGHT_CHANNEL: chromium
        working-directory: src/ui
      - name: Verify draft-preserving dismissal and full card saves
        id: draft_contract
        run: yarn playwright test -c playwright.card-draft-close.config.ts
        env:
          CI: "true"
        working-directory: src/ui
      - name: Preserve failed draft contract evidence
        if: failure() && steps.draft_contract.outcome == 'failure'
        uses: actions/upload-artifact@v4
        with:
          name: draft-contract-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: src/ui/test-results/
          if-no-files-found: ignore
          retention-days: 7
      - name: Verify board resources, annotations, workflow history and project collections
        run: yarn playwright test -c playwright.board-resources.config.ts
        env:
          CI: "true"
        working-directory: src/ui
      - name: Verify native collaborative drafts and column history boundaries
        run: |
          node --experimental-strip-types --test src/components/Collaborative/editorAuthentication.test.mjs
          node --experimental-strip-types --test src/components/Editor/collaborativeInitialization.test.mjs src/components/Editor/prepareRichDraftPatch.test.ts
          yarn playwright test -c playwright.collaborative-draft.config.ts
          yarn playwright test -c playwright.card-timeline.config.ts
        env:
          CI: "true"
          PLAYWRIGHT_CHANNEL: chromium
        working-directory: src/ui
      - name: Verify mounted Card Decision contracts
        run: yarn playwright test -c playwright.card-decision.config.ts
        env:
          CI: "true"
        working-directory: src/ui
      - name: Verify mounted Wiki secret selection contracts
        run: yarn playwright test -c playwright.wiki-secret-selection.config.ts
        env:
          CI: "true"
        working-directory: src/ui
      - name: Verify personal Signal Inbox and source-board handoff
        run: yarn playwright test -c playwright.personal-signal-inbox.config.ts
        env:
          CI: "true"
        working-directory: src/ui
      - name: Verify user login range and business activity controls
        run: yarn playwright test -c playwright.user-login-range.config.ts
        env:
          CI: "true"
        working-directory: src/ui
      - name: Verify administrator SMTP diagnostics
        run: yarn playwright test -c playwright.settings-mail.config.ts
        env:
          CI: "true"
        working-directory: src/ui
      - name: Verify saved board filter combinations
        run: yarn playwright test -c playwright.filter.config.ts BoardFilter.spec.ts
        env:
          CI: "true"
        working-directory: src/ui
