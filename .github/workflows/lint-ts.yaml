name: Lint TS

on: workflow_dispatch

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"

jobs:
  run-linters:
    name: Run Linters
    if: vars.CI_RUNNER != ''
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    permissions:
      contents: write
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Enable Corepack
        run: corepack enable
      - name: Cache Core cache
        uses: actions/cache@v4
        with:
          path: src/shared/ts/.yarn/cache
          key: ${{ runner.os }}-yarncache-core-${{ hashFiles('src/shared/ts/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarncache-core-
      - name: Cache UI cache
        uses: actions/cache@v4
        with:
          path: src/ui/.yarn/cache
          key: ${{ runner.os }}-yarncache-ui-${{ hashFiles('src/ui/yarn.lock') }}
          restore-keys: ${{ runner.os }}-yarncache-ui-
      - name: Install deps (Core)
        working-directory: src/shared/ts
        run: yarn install --immutable
      - name: Install deps (UI)
        working-directory: src/ui
        run: yarn install --immutable
      - name: Run Core Linter
        working-directory: src/shared/ts
        run: yarn run lint
      - name: Run UI Linter
        working-directory: src/ui
        run: yarn run lint
