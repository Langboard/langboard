name: Check Execution Cutover

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-execution-cutover.yaml
      - pyproject.toml
      - uv.lock
      - src/shared/py/pyproject.toml
      - src/api/langboard/routes/board/BoardCardApi.py
      - src/api/langboard/routes/board/ExecutionReceiptApi.py
      - src/api/langboard/routes/schemas/WebhookSchemaApi.py
      - src/api/langboard/migrations/versions/**
      - src/api/tests/webhooks/test_card_context_execution.py
      - src/api/tests/webhooks/test_execution*.py
      - src/api/tests/webhooks/test_dependency_policy_postgres.py
      - src/api/tests/webhooks/test_native_execution_receipt_postgres.py
      - src/api/tests/card_workspace/test_receipt_move_workflow_admission.py
      - src/api/langboard/card_workspace/application/execution_receipts.py
      - src/api/langboard/mcp_tools/ExecutionMcp.py
      - src/api/tests/mcp_integration/test_execution_receipts_mcp.py
      - src/shared/py/langboard_shared/tasks/webhooks/**
      - src/shared/py/langboard_shared/domain/DependencyConditions.py
      - src/shared/py/langboard_shared/domain/services/DependencyPolicy.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  postgres-contract:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: langboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        options: >-
          --health-cmd "pg_isready -U postgres -d langboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROJECT_NAME: langboard
    steps:
      - name: Resolve PostgreSQL service address
        run: echo "LANGBOARD_OUTBOX_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test" >> "$GITHUB_ENV"
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # PR checks restore caches; manual runs can warm them without blocking review.
          save-cache: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check src/api/langboard/card_workspace/application/execution_receipts.py src/api/langboard/mcp_tools/ExecutionMcp.py src/api/tests/mcp_integration/test_execution_receipts_mcp.py src/api/tests/webhooks/test_card_context_execution.py src/api/tests/webhooks/test_execution_receipt_authorization.py src/api/tests/webhooks/test_dependency_policy_postgres.py src/api/tests/webhooks/test_execution_readiness_uow_postgres.py src/api/tests/webhooks/test_execution_outbox_postgres.py src/api/tests/webhooks/test_execution_signed_http.py src/api/tests/webhooks/test_native_execution_receipt_postgres.py src/api/tests/webhooks/test_execution_outbox.py src/api/tests/webhooks/test_execution_import_order.py src/api/tests/webhooks/test_execution_binding.py src/api/tests/webhooks/test_execution_event_contract.py src/shared/py/langboard_shared/domain/DependencyConditions.py src/shared/py/langboard_shared/domain/services/DependencyPolicy.py src/shared/py/langboard_shared/tasks/webhooks/ExecutionReadinessUow.py src/shared/py/langboard_shared/tasks/webhooks/ExecutionOutboxWorker.py src/api/langboard/routes/board/BoardCardApi.py src/api/langboard/routes/board/ExecutionReceiptApi.py
      - run: uv run --no-sync pytest -q src/api/tests/mcp_integration/test_execution_receipts_mcp.py src/api/tests/webhooks/test_card_context_execution.py src/api/tests/webhooks/test_execution_receipt_authorization.py src/api/tests/webhooks/test_dependency_policy_postgres.py src/api/tests/webhooks/test_execution_readiness_uow_postgres.py src/api/tests/webhooks/test_execution_outbox_postgres.py src/api/tests/webhooks/test_execution_signed_http.py src/api/tests/webhooks/test_native_execution_receipt_postgres.py src/api/tests/webhooks/test_execution_outbox.py src/api/tests/webhooks/test_execution_import_order.py src/api/tests/webhooks/test_execution_binding.py src/api/tests/webhooks/test_execution_event_contract.py
      - name: Verify durable receipt movement workflow admission
        run: |
          : "${LANGBOARD_OUTBOX_TEST_DATABASE_URL:?PostgreSQL service URL is required}"
          uv run --no-sync ruff check src/api/tests/card_workspace/test_receipt_move_workflow_admission.py
          uv run --no-sync pytest -q src/api/tests/card_workspace/test_receipt_move_workflow_admission.py
