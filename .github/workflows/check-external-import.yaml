name: Check External Import

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - .github/workflows/check-external-import.yaml
      - pyproject.toml
      - uv.lock
      - src/shared/py/pyproject.toml
      - src/api/langboard/external_import/**
      - src/api/tests/external_import/**
      - src/api/tests/card_workspace/test_completion_checklist*.py
      - src/shared/py/langboard_shared/domain/services/factory/CardAttachmentService_document_test.py
      - src/shared/py/langboard_shared/domain/services/factory/CardService.py
      - src/shared/py/langboard_shared/domain/services/factory/CheckitemService.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  contract:
    name: external-import-contract
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: langboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROJECT_NAME: langboard
    steps:
      - name: Resolve PostgreSQL service address
        run: echo "LANGBOARD_OUTBOX_TEST_DATABASE_URL=postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test" >> "$GITHUB_ENV"
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # PR checks restore caches; manual runs can warm them without blocking review.
          save-cache: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: uv sync --frozen
      - run: uv run --no-sync ruff check src/api/langboard/external_import src/shared/py/langboard_shared/domain/services/factory/CardAttachmentService_document_test.py src/api/tests/external_import src/api/tests/card_workspace/test_completion_checklist_migration.py src/api/tests/card_workspace/test_completion_checklist_service.py src/shared/py/langboard_shared/domain/services/factory/CardService.py src/shared/py/langboard_shared/domain/services/factory/CheckitemService.py
      - run: uv run --no-sync pytest -q src/shared/py/langboard_shared/domain/services/factory/CardAttachmentService_document_test.py src/api/tests/external_import src/api/tests/card_workspace/test_completion_checklist_migration.py src/api/tests/card_workspace/test_completion_checklist_service.py
