      - src/api/langboard/routes/board/BoardSettingApi.py
      - src/shared/py/langboard_shared/domain/services/AppPanel.py
      - src/shared/py/langboard_shared/domain/services/AppRegistry.py
      - src/api/langboard/routes/settings/WorkflowStageSettingsApi.py
      - src/api/langboard/routes/settings/Form.py
      - src/api/langboard/card_workspace/**
      - src/api/langboard/mcp_tools/UserMcp.py
      - src/api/langboard/migrations/versions/20261002114000-4afb6de824d3.py
      - src/api/langboard/migrations/versions/20261002234000-7be934f2a6c1.py
      - src/shared/py/langboard_shared/domain/models/WorkflowStageDefinition.py
      - src/shared/py/langboard_shared/domain/models/WorkflowRule*.py
      - src/shared/py/langboard_shared/domain/models/WorkflowActionRun.py
      - src/shared/py/langboard_shared/domain/services/factory/WorkflowRuleService.py
      - src/shared/py/langboard_shared/domain/services/CardWorkState.py
      - src/shared/py/langboard_shared/domain/services/DecisionPolicy.py
      - src/shared/py/langboard_shared/domain/services/DecisionPolicy_test.py
      - src/shared/py/langboard_shared/domain/services/factory/WorkflowStageService.py
      - src/shared/py/langboard_shared/domain/services/factory/WorkflowStagePolicyService.py
      - src/shared/py/langboard_shared/domain/services/factory/CardService.py
      - src/shared/py/langboard_shared/domain/services/factory/CheckitemService.py
      - src/shared/py/langboard_shared/domain/services/factory/ProjectColumnService.py
      - src/shared/py/langboard_shared/infrastructure/repositories/factory/WorkflowStageRepository.py
      - src/shared/py/langboard_shared/infrastructure/repositories/factory/CardRepository.py
      - src/shared/py/langboard_shared/infrastructure/repositories/factory/CheckitemTimerRecordRepository.py
      - src/shared/py/langboard_shared/publishers/CheckitemPublisher.py
      - src/shared/py/langboard_shared/publishers/ProjectWikiPublisher.py
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  policy-and-transition:
    if: vars.CI_RUNNER != '' && (github.event_name == 'workflow_dispatch' || (github.event.pull_request.draft == false && github.event.pull_request.head.repo.full_name == github.repository))
    timeout-minutes: 20
    runs-on: ${{ fromJSON(vars.CI_RUNNER || '"unconfigured"') }}
    container: ubuntu:24.04
    defaults:
      run:
        shell: bash
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: langboard_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d langboard_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      PROJECT_NAME: langboard
      PYTHONPATH: .
    steps:
      - name: Prepare standard job tools
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends ca-certificates curl git libsqlite3-0 tar unzip xz-utils
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          # PR checks restore caches; manual runs can warm them without blocking review.
          save-cache: ${{ github.event_name != 'pull_request' }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify Python standard library database runtime
        run: python -c "import sqlite3; assert sqlite3.connect(':memory:').execute('SELECT 1').fetchone() == (1,)"
      - run: uv sync --frozen --group graph-approval-tests
      - name: Verify recursive Decision policy contract
        run: uv run --no-sync python src/shared/py/langboard_shared/domain/services/DecisionPolicy_test.py -v
      - name: Verify PostgreSQL service connection
        env:
          LANGBOARD_EFFECT_TEST_DATABASE: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
        run: |
          uv run --no-sync python - <<'PY'
          import os
          from sqlalchemy import create_engine, text
          engine = create_engine(os.environ["LANGBOARD_EFFECT_TEST_DATABASE"], connect_args={"connect_timeout": 10})
          with engine.connect() as db:
              assert db.execute(text("SELECT 1")).scalar_one() == 1
          engine.dispose()
          PY
      - name: Registry, guidance, policy and SQLite transitions
        run: uv run --no-sync pytest -q src/api/tests/workflow_stages src/api/tests/workflow_rules
      - name: Native app registry, panel consent and management
        env:
          PYTHONPATH: src/shared/py:src/api
        run: uv run --no-sync pytest -q src/api/tests/apps/test_sdk_app_registry_http.py src/api/tests/apps/test_sdk_management_http.py src/api/tests/webhooks/test_webhook_contract.py
      - name: Distinct column context for card list and search
        run: uv run --no-sync pytest -q src/api/tests/card_workspace/test_queries.py src/api/tests/card_workspace/test_native_adapter.py src/api/tests/mcp_integration/test_user_mcp.py src/api/tests/mcp_integration/test_project_column_tools.py src/shared/py/langboard_shared/domain/services/factory/ProjectColumnService_test.py
      - name: PostgreSQL transitions, common rules and rollback
        env:
          LANGBOARD_EFFECT_TEST_DATABASE: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
          LANGBOARD_FILE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
        run: uv run --no-sync pytest -q src/api/tests/workflow_stages/test_entry_effects.py src/api/tests/workflow_stages/test_descendant_move.py src/api/tests/workflow_rules
      - name: Native Decision authority, ballots and responder selection
        env:
          PYTHONPATH: src/shared/py:src/api
          LANGBOARD_DECISION_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
          LANGBOARD_ACTORS_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
          LANGBOARD_APPROVAL_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
        run: uv run --no-sync pytest -q -p no:tach src/api/tests/decisions src/api/tests/runtime/test_internal_bot_graph_request.py src/api/tests/runtime/test_socket_board_chat_run.py src/api/tests/runtime/test_socket_editor_run.py
      - name: Native Wiki selection secret conversion and editor lineage
        env:
          PYTHONPATH: src/shared/py:src/api
          LANGBOARD_FILE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
        run: |
          uv run --no-sync pytest -q -p no:tach --junitxml="$RUNNER_TEMP/wiki-selection-tests.xml" src/api/tests/secrets/test_wiki_selection_secret.py src/api/tests/secrets/test_wiki_derived_reads.py src/api/tests/secrets/test_protected_name_history.py src/api/tests/migrations/test_secret_name_history_migration.py
          uv run --no-sync python - <<'PYTHON'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = ElementTree.parse(Path(os.environ["RUNNER_TEMP"]) / "wiki-selection-tests.xml")
          assert not report.findall(".//skipped"), "Wiki PostgreSQL regression cases must execute"
          PYTHON
      - name: Native Graph approval, agent loop, checkpoint privacy and scheduled admission
        env:
          PYTHONPATH: src/graph:src/shared/py:src/api
          LANGBOARD_FILE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
        run: |
          uv run --no-sync pytest -q -p no:tach --junitxml="$RUNNER_TEMP/graph-approval-tests.xml" src/api/tests/core/test_graph_approval_storage_safety.py src/graph/tests/test_approval_execution_plan.py src/graph/tests/test_agent_loop.py src/graph/tests/test_graph_privacy.py src/graph/tests/test_runtime_authority.py src/graph/tests/test_graph_schedule_admission.py
          uv run --no-sync python - <<'PY'
          import os
          from pathlib import Path
          from xml.etree import ElementTree

          report = ElementTree.parse(Path(os.environ["RUNNER_TEMP"]) / "graph-approval-tests.xml")
          assert not report.findall(".//skipped"), "Graph PostgreSQL regression cases must execute"
          PY
      - name: Native Group invitations and board Team membership
        env:
          PYTHONPATH: src/shared/py:src/api
          LANGBOARD_GROUP_INVITE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
          LANGBOARD_TEAM_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
        run: uv run --no-sync pytest -q -p no:tach src/api/tests/iam/test_board_group_invitation.py src/api/tests/iam/test_board_teams.py
      - name: Durable one-time bot admission and scoped retry receipts
        env:
          LANGBOARD_FILE_TEST_DATABASE_URL: postgresql+psycopg://postgres:postgres@${{ job.container.network && 'postgres' || '127.0.0.1' }}:5432/langboard_test
        run: uv run --no-sync pytest -q src/api/tests/bots/test_bot_schedule_recovery.py src/api/tests/bots/test_bot_schedule_admission_projection.py
